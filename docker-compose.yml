version: '3.9'
services:
  postgresql:
    image: postgres:15-alpine
    container_name: bridge-talk-database
    env_file:
      - .docker/.env.db
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bridge-talk-app
    ports:
      - "3000:3000"
    env_file:
      - .env.production.local
    depends_on:
      - postgresql
    networks:
      - app_network
    deploy:
      replicas: ${APP_REPLICAS:-0}

volumes:
  db_data:
    driver: local

networks:
  app_network:
    driver: bridge
